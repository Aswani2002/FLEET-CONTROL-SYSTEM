<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Control</title>
    <style>
        .box
        {
            width:350px;
            height:450px;
            transform:translate(-50%, -50%);
            position:absolute;
            top:50%;
            left:50%;
            box-shadow: 0 4px 8px 0 rgba(255, 255, 255, 0.459), 0 6px 20px 0 rgba(255, 255, 255, 0.463);
            background-color:white;

        }

        .center
        {
            text-align: center;
        }

        body
        {
            background-color: blue;
        }

        .ip
        {
            padding:10px;
            border:none;
            text-align: center;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);

        }
        
        .bt
        {
            background-color: blue;
            color: white;
            padding:12px;
            font-size: 15px;
            border-radius: 10px;
            border:none;
            width:100px;

        }


        .bt:hover
        {
            background-color: rgb(5, 5, 97);
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="center">
            <img src="{% static 'razor.jpg' %}" alt="" height="70px">
            <br>
            <br>
            <form method="POST">
                {% csrf_token %}
                    <input type="text" name="name" value="{{ request.user.name }}" class="ip">
                    <br>
                    <br>
                    <input type="text" name="bank_name" class="ip" placeholder="Enter Your bank name">
                                   
                    <br>
                    <br>
                    <input type="text" name="bank_acc_no" class="ip" placeholder="Enter Your Card Number" pattern="[0-9]{16}" title="Please enter exactly 16 digits" required>
                    <br>
                    <br>
                    <input type="text" name="cvv" class="ip" placeholder="Enter Your Card CVV" pattern="[0-9]{3}" title="Please enter exactly 3 digits" required>
                    <br>
                    <br>
                    <input type="text" name="amount" value="{{checkout_instance.total_price}}" class="ip">

                    <br>
                    <br>
                    <br>
                <button type="submit" class="bt">Pay</button>
            </form>
        </div>
    </div>
</body>
</html>
